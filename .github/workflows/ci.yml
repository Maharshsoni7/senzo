name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Migrations match the schema
        run: |
          pnpm --filter api exec drizzle-kit generate --name ci-check
          git diff --exit-code --stat -- apps/api/migrations
          test -z "$(git status --porcelain -- apps/api/migrations)"
      - name: API client matches the API
        run: |
          pnpm --filter api-client generate
          test -z "$(git status --porcelain -- packages/api-client)"
