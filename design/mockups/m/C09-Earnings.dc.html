<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earnings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1B1D1F}a:hover{color:#B8361F}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; color: #1B1D1F; font-family: 'Archivo', system-ui, sans-serif; background-color: #ECE8E1; isolation: isolate; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 16px;">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: -1;">
    <dc-import name="KitchenBg" variant="header" strip="100" hint-size="390px,844px"></dc-import>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="C04-Dashboard.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9CDD1; display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; flex: 1;">Earnings</h1>
    <a href="C18-Tax.dc.html" style="font-size: 13px; font-weight: 700; color: #B8361F; min-height: 44px; display: flex; align-items: center;">Tax docs</a>
  </div>
  <a href="C17-PayoutFailed.dc.html" style="display: flex; align-items: center; gap: 10px; background: #FBEDEA; border: 1.5px solid #B8361F; border-radius: 14px; padding: 10px 14px; text-decoration: none; color: #6E2414;">
    <span style="width: 24px; height: 24px; border-radius: 99px; background: #B8361F; color: #FFFFFF; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none;">!</span>
    <span style="flex: 1; font-size: 13px;"><strong>Last payout failed</strong> · ₹9,380 is safe — fix bank details</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <div style="background: #24282C; color: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #C8CDD2;">READY TO WITHDRAW</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 600;">{{bal}}</span>
    <span style="font-size: 12px; color: #C8CDD2;">Auto-payout daily at 11 AM to HDFC ···· 1290</span>
    <button onClick="{{withdraw}}" disabled="{{sent}}" style="margin-top: 12px; min-height: 50px; border-radius: 999px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: {{btnBg}}; color: {{btnFg}};">{{btnLabel}}</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center;">
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 6px;"><div style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px;">₹27,740</div><div style="font-size: 11px; color: #5A5F66;">November</div></div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 6px;"><div style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px;">3</div><div style="font-size: 11px; color: #5A5F66;">jobs done</div></div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 6px;"><div style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px;">₹600</div><div style="font-size: 11px; color: #5A5F66;">tips</div></div>
  </div>

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #3D4247; font-weight: 600;">HISTORY</div>
  <div style="background: #FFFEFB; border-radius: 4px; padding: 4px 16px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; border-bottom: 1px dashed #D5D8DB;">
        <div><div style="font-size: 14px; font-weight: 700;">{{r.t}}</div><div style="font-size: 12px; color: #5A5F66;">{{r.d}}</div></div>
        <div style="text-align: right;"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: {{r.fg}};">{{r.a}}</div><div style="font-size: 11px; color: #5A5F66;">{{r.s}}</div></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false }; }
  renderVals() {
    const sent = this.state.sent;
    return {
      bal: sent ? '₹0' : '₹9,380', sent,
      withdraw: () => this.setState({ sent: true }),
      btnLabel: sent ? 'Sent · reaches your bank in ~30 min' : 'Withdraw now',
      btnBg: sent ? '#3A4045' : '#FFFFFF', btnFg: sent ? '#9FE0B4' : '#1B1D1F',
      rows: [
        { t: 'Rahul Desai · 6 guests', d: 'Sat 7 Nov', a: '+₹9,380', s: 'Released', fg: '#1E6B36' },
        { t: 'Payout to HDFC', d: 'Wed 4 Nov', a: '−₹9,180', s: 'Paid', fg: '#1B1D1F' },
        { t: 'Neha M. · 6 guests', d: 'Tue 3 Nov', a: '+₹9,180', s: 'Released', fg: '#1E6B36' },
        { t: 'Harsh P. · 10 guests', d: 'Sun 1 Nov', a: '+₹9,180', s: 'Paid out', fg: '#1E6B36' }
      ]
    };
  }
}
</script>
</body>
</html>
