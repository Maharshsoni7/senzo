<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chef figure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="display: block; line-height: 0; font-family: 'IBM Plex Mono', monospace; color: #1B1D1F;">
<svg width="{{w}}" height="{{h}}" viewBox="{{vb}}" aria-hidden="true" style="display: block;">
  <path d="M74 296 L96 296 L95 396 L76 396 Z" fill="#2B2F33"></path>
  <path d="M104 296 L126 296 L124 396 L105 396 Z" fill="#2B2F33"></path>
  <ellipse cx="83" cy="400" rx="17" ry="7" fill="#1B1D1F"></ellipse>
  <ellipse cx="117" cy="400" rx="17" ry="7" fill="#1B1D1F"></ellipse>
  <path d="M64 92 Q60 152 80 154 L120 154 Q140 152 136 92 Z" fill="{{hair}}" opacity="{{longOp}}"></path>
  <path d="M58 150 Q100 134 142 150 L150 302 L50 302 Z" fill="#FFFFFF" stroke="#D5D8DB" stroke-width="1.5"></path>
  <path d="M58 152 Q40 170 38 252 L53 254 Q56 192 68 172 Z" fill="#FFFFFF" stroke="#D5D8DB" stroke-width="1.5"></path>
  <path d="M142 152 Q160 170 162 252 L147 254 Q144 192 132 172 Z" fill="#FFFFFF" stroke="#D5D8DB" stroke-width="1.5"></path>
  <circle cx="45" cy="261" r="9" fill="{{skin}}"></circle>
  <circle cx="155" cy="261" r="9" fill="{{skin}}"></circle>
  <path d="M66 214 L134 214 L140 322 L60 322 Z" fill="{{apron}}"></path>
  <rect x="60" y="208" width="80" height="9" rx="3" fill="{{apron}}"></rect>
  <path d="M86 228 L114 228 L114 246 L86 246 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"></path>
  <circle cx="90" cy="172" r="3" fill="#9EA4AA"></circle>
  <circle cx="110" cy="172" r="3" fill="#9EA4AA"></circle>
  <circle cx="90" cy="192" r="3" fill="#9EA4AA"></circle>
  <circle cx="110" cy="192" r="3" fill="#9EA4AA"></circle>
  <rect x="90" y="118" width="20" height="26" fill="{{skin}}"></rect>
  <path d="M84 140 L116 140 L100 160 Z" fill="{{apron}}"></path>
  <circle cx="70" cy="99" r="6" fill="{{skin}}"></circle>
  <circle cx="130" cy="99" r="6" fill="{{skin}}"></circle>
  <ellipse cx="100" cy="97" rx="30" ry="33" fill="{{skin}}"></ellipse>
  <path d="M72 106 Q74 140 100 134 Q126 140 128 106 Q122 128 100 128 Q78 128 72 106 Z" fill="{{hair}}" opacity="{{beardOp}}"></path>
  <path d="M70 90 Q100 64 130 90 L131 76 Q100 56 69 76 Z" fill="{{hair}}"></path>
  <path d="M83 90 L94 88" stroke="{{hair}}" stroke-width="3" stroke-linecap="round"></path>
  <path d="M106 88 L117 90" stroke="{{hair}}" stroke-width="3" stroke-linecap="round"></path>
  <circle cx="89" cy="99" r="3.2" fill="#1B1D1F"></circle>
  <circle cx="111" cy="99" r="3.2" fill="#1B1D1F"></circle>
  <path d="M90 113 Q100 121 110 113" fill="none" stroke="#1B1D1F" stroke-width="2.5" stroke-linecap="round"></path>
  <circle cx="78" cy="42" r="18" fill="#FFFFFF" stroke="#D5D8DB" stroke-width="1.5"></circle>
  <circle cx="122" cy="42" r="18" fill="#FFFFFF" stroke="#D5D8DB" stroke-width="1.5"></circle>
  <circle cx="100" cy="32" r="23" fill="#FFFFFF" stroke="#D5D8DB" stroke-width="1.5"></circle>
  <rect x="70" y="52" width="60" height="24" rx="4" fill="#FFFFFF" stroke="#D5D8DB" stroke-width="1.5"></rect>
  <rect x="116" y="164" width="24" height="13" rx="2" fill="#1B1D1F"></rect>
  <text x="128" y="174" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">{{initials}}</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"color","default":"#D9A273"},"hair":{"editor":"color","default":"#1E1612"},"apron":{"editor":"color","default":"#B8361F"},"longOp":{"editor":"enum","options":["0","1"],"default":"1"},"beardOp":{"editor":"enum","options":["0","1"],"default":"0"},"initials":{"editor":null,"default":"AM"},"w":{"editor":null,"default":"200"},"bust":{"editor":"boolean","default":false},"$preview":{"width":200,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const w = Number(p.w) || 200;
    const bust = p.bust === true || p.bust === '1' || p.bust === 'true';
    return {
      skin: p.skin || '#D9A273', hair: p.hair || '#1E1612', apron: p.apron || '#B8361F',
      longOp: p.longOp ?? '1', beardOp: p.beardOp ?? '0', initials: p.initials || 'AM',
      w: w, h: bust ? w : Math.round(w * 2.1), vb: bust ? '50 6 100 100' : '0 0 200 420'
    };
  }
}
</script>
</body>
</html>
