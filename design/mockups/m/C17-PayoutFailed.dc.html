<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payout failed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1B1D1F}a:hover{color:#B8361F}button:focus-visible,a:focus-visible{outline:3px solid #B8361F;outline-offset:2px}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EB; color: #1B1D1F; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 14px;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="C09-Earnings.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 99px; background: #FFFFFF; border: 1px solid #D5D0C7; display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px;">Payout</h1>
  </div>

  <div style="background: {{cardBg}}; border: 1.5px solid {{cardBd}}; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; font-weight: 600; color: {{cardFg}};">{{tag}}</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600;">₹9,380</div>
    <div style="font-size: 14px; color: #3D4247; line-height: 1.45;">{{msg}}</div>
  </div>

  <sc-if value="{{failed}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="background: #FFFFFF; border-radius: 14px; border: 1px solid #EAE5DC; padding: 14px 16px; font-size: 13px; line-height: 1.5;">
        <strong>Why it failed</strong><br>
        <span style="color: #3D4247;">The bank says the account holder name doesn’t match <em>“Ananya Mehta”</em>. Your money is safe in your Senzo balance.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0; background: #FFFFFF; border-radius: 14px; border: 1px solid #EAE5DC; padding: 4px 16px;">
        <div style="display: flex; justify-content: space-between; min-height: 42px; align-items: center; border-bottom: 1px solid #F1EEE8; font-size: 13px;"><span>Account</span><strong>HDFC ···· 1290</strong></div>
        <div style="display: flex; justify-content: space-between; min-height: 42px; align-items: center; border-bottom: 1px solid #F1EEE8; font-size: 13px;"><span>Tried</span><strong>Sun 8 Nov, 11:00 AM</strong></div>
        <div style="display: flex; justify-content: space-between; min-height: 42px; align-items: center; font-size: 13px;"><span>Reference</span><strong style="font-family: 'IBM Plex Mono', monospace;">PO-77120</strong></div>
      </div>
    </div>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
    <sc-if value="{{failed}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <a href="C12-EditProfile.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #B8361F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">Fix bank details</a>
        <button onClick="{{retry}}" style="height: 52px; border-radius: 999px; border: 1.5px solid #1B1D1F; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; color: #1B1D1F;">Retry to same account</button>
        <button style="height: 44px; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #5A5F66; cursor: pointer;">Contact support</button>
      </div>
    </sc-if>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
      <a href="C09-Earnings.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #1B1D1F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">Back to earnings</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ok: false }; }
  renderVals() {
    const ok = this.state.ok;
    return {
      failed: !ok, ok,
      retry: () => this.setState({ ok: true }),
      tag: ok ? 'PAYOUT SENT' : 'PAYOUT FAILED',
      msg: ok ? 'Sent again to HDFC ···· 1290. It usually lands within 30 minutes.' : 'We couldn’t send this to your bank. Nothing is lost — fix the details and we’ll resend.',
      cardBg: ok ? '#E6F2EA' : '#FBEDEA', cardBd: ok ? '#1E7A3C' : '#B8361F', cardFg: ok ? '#1E6B36' : '#8E2A17'
    };
  }
}
</script>
</body>
</html>
