<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add address</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1B1D1F}a:hover{color:#B8361F}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #B8361F;outline-offset:2px}
@keyframes drop{0%{transform:translateY(-14px)}60%{transform:translateY(2px)}100%{transform:none}}.drop{animation:drop .5s ease-out}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EB; color: #1B1D1F; font-family: 'Archivo', system-ui, sans-serif;">
  <!-- map -->
  <div style="position: relative; height: 300px; background: #E4E7E1; overflow: hidden;">
    <svg width="390" height="300" viewBox="0 0 390 300" aria-hidden="true" style="display: block;">
      <rect width="390" height="300" fill="#E6E9E2"></rect>
      <rect x="20" y="30" width="110" height="70" rx="6" fill="#D9DED3"></rect><rect x="150" y="30" width="90" height="70" rx="6" fill="#D9DED3"></rect><rect x="260" y="30" width="120" height="70" rx="6" fill="#CFE0C6"></rect>
      <rect x="20" y="130" width="110" height="80" rx="6" fill="#D9DED3"></rect><rect x="150" y="130" width="90" height="80" rx="6" fill="#D9DED3"></rect><rect x="260" y="130" width="120" height="80" rx="6" fill="#D9DED3"></rect>
      <rect x="20" y="240" width="110" height="60" rx="6" fill="#CFE0C6"></rect><rect x="150" y="240" width="230" height="60" rx="6" fill="#D9DED3"></rect>
      <path d="M0 115 H390 M0 225 H390" stroke="#FFFFFF" stroke-width="14"></path>
      <path d="M140 0 V300 M250 0 V300" stroke="#FFFFFF" stroke-width="10"></path>
      <path d="M0 115 H390" stroke="#F2D48A" stroke-width="3" stroke-dasharray="10 8"></path>
      <text x="290" y="110" font-size="10" fill="#5A5F66" font-family="Archivo, sans-serif">Judges Bungalow Rd</text>
    </svg>
    <div class="drop" style="position: absolute; left: 195px; top: 150px; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;">
      <span style="background: #1B1D1F; color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 8px; white-space: nowrap; margin-bottom: 4px;">Move map to your gate</span>
      <svg width="34" height="44" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 31s10-11.5 10-19A10 10 0 0 0 2 12c0 7.5 10 19 10 19z" fill="#B8361F"></path><circle cx="12" cy="12" r="4" fill="#FFFFFF"></circle></svg>
    </div>
    <a href="G14-Account.dc.html" aria-label="Back" style="position: absolute; left: 16px; top: 48px; width: 44px; height: 44px; border-radius: 99px; background: #FFFFFF; border: 1px solid #D5D0C7; display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <button aria-label="Use my current location" style="position: absolute; right: 16px; bottom: 16px; width: 44px; height: 44px; border-radius: 99px; background: #FFFFFF; border: 1px solid #D5D0C7; display: grid; place-items: center; cursor: pointer; color: #1B1D1F;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 284px; bottom: 96px; background: #F4F1EB; border-radius: 20px 20px 0 0; overflow-y: auto; padding: 18px 20px 20px; box-sizing: border-box; display: grid; align-content: start; gap: 14px;">
    <div>
      <div style="font-size: 12px; font-weight: 700; color: #5A5F66; margin-bottom: 6px;">AREA</div>
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{areas}}" as="a" hint-placeholder-count="2">
          <button onClick="{{a.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid {{a.bd}}; background: {{a.bg}}; color: {{a.fg}};">{{a.l}}</button>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 10px; align-items: center; background: #E6F2EA; border-radius: 12px; padding: 12px 14px; color: #1E4D2E; font-size: 13px;">
        <span style="width: 22px; height: 22px; border-radius: 99px; background: #1E7A3C; display: grid; place-items: center; flex: none;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
        <span><strong>Bodakdev, Ahmedabad 380054</strong><br>Great — 11 chefs cook in your area</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Flat / house no.<input value="B-402" style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D0C7; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1B1D1F;"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Floor<input value="4th, lift available" style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D0C7; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1B1D1F;"></label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Building / society<input value="Shaligram Heights" style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D0C7; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1B1D1F;"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Gate &amp; entry instructions<input value="Gate 2 · tell guard ‘Senzo for B-402’" style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D0C7; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1B1D1F;"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Landmark<input value="Opp. Bodakdev garden" style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D0C7; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1B1D1F;"></label>
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{labels}}" as="l" hint-placeholder-count="3">
          <button onClick="{{l.pick}}" style="min-height: 38px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid {{l.bd}}; background: {{l.bg}}; color: {{l.fg}};">{{l.l}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 12px; color: #5A5F66;">Your full address is shared with the chef only after they accept.</p>
    </sc-if>
    <sc-if value="{{notOk}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFEFB; border-radius: 14px; padding: 18px; text-align: center; border: 2px dashed #B9B2A6;">
        <div style="font-size: 17px; font-weight: 800;">We’re not in Sanand yet</div>
        <div style="font-size: 13px; color: #3D4247; margin-top: 4px; line-height: 1.45;">We cook across Ahmedabad &amp; Gandhinagar today. Get a message the day we arrive.</div>
        <button onClick="{{notify}}" style="margin-top: 12px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #1B1D1F; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">{{notifyLabel}}</button>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #2F3D37; box-shadow: 0 -2px 0 #F7F5F1, 0 -5px 0 #D8D4CC; padding: 14px 16px 26px; box-sizing: border-box;">
    <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
      <a href="G08-Availability.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #B8361F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">Save address</a>
    </sc-if>
    <sc-if value="{{notOk}}" hint-placeholder-val="{{ false }}">
      <span style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #4A5853; color: #B9C6BF; font-size: 16px; font-weight: 700;">Outside service area</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { area: 'Bodakdev', label: 'Home', notified: false }; }
  chip(on) { return on ? { bg: '#1B1D1F', fg: '#FFFFFF', bd: '#1B1D1F' } : { bg: '#FFFFFF', fg: '#1B1D1F', bd: '#D5D0C7' }; }
  renderVals() {
    const s = this.state;
    return {
      areas: ['Bodakdev', 'Sanand (try it)'].map((l) => { const key = l.split(' ')[0]; return Object.assign({ l, pick: () => this.setState({ area: key }) }, this.chip(s.area === key)); }),
      ok: s.area === 'Bodakdev', notOk: s.area !== 'Bodakdev',
      labels: ['Home', 'Work', 'Other'].map((l) => Object.assign({ l, pick: () => this.setState({ label: l }) }, this.chip(s.label === l))),
      notify: () => this.setState({ notified: true }),
      notifyLabel: s.notified ? '✓ We’ll let you know' : 'Notify me'
    };
  }
}
</script>
</body>
</html>
