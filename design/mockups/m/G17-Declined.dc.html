<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chef couldn't take your booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1B1D1F}a:hover{color:#B8361F}a:focus-visible{outline:3px solid #B8361F;outline-offset:2px}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EB; color: #1B1D1F; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 16px;">
  <a href="G11-Bookings.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 99px; background: #FFFFFF; border: 1px solid #D5D0C7; display: grid; place-items: center;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
  </a>
  <div style="display: flex; gap: 14px; align-items: center;">
    <span style="width: 64px; height: 64px; border-radius: 99px; overflow: hidden; background: #F3EBE5; flex: none; filter: grayscale(.6);">
      <dc-import name="ChefFig" skin="#B67A4E" hair="#1B1714" apron="#7A3E1D" long-op="0" beard-op="1" initials="RK" w="64" bust="1" hint-size="64px,64px"></dc-import>
    </span>
    <div>
      <h1 style="margin: 0; font-size: 22px; line-height: 1.15;">Rohan couldn’t take this one</h1>
      <div style="font-size: 13px; color: #3D4247; margin-top: 4px;">No reply within 2 hours · Sun 15 Nov, lunch</div>
    </div>
  </div>

  <div style="align-self: flex-start; transform: rotate(-1.5deg); border: 2px dashed #1E7A3C; border-radius: 10px; padding: 10px 16px; background: #E6F2EA; color: #1E4D2E;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; font-weight: 600;">FULL REFUND SENT</div>
    <div style="font-size: 20px; font-weight: 800; font-family: 'IBM Plex Mono', monospace;">₹13,376</div>
    <div style="font-size: 12px;">Back to Google Pay in 3–5 working days</div>
  </div>

  <div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #3D4247; font-weight: 600;">SIMILAR CHEFS FREE ON SUN 15 NOV</div>
    <div style="font-size: 12px; color: #5A5F66; margin-top: 2px;">Same date, time and guests · book in one tap</div>
  </div>
  <sc-for list="{{chefs}}" as="c" hint-placeholder-count="3">
    <div style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border-radius: 16px; padding: 12px; border: 1px solid #EAE5DC;">
      <span style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: {{c.tint}}; flex: none;">
        <dc-import name="ChefFig" skin="{{c.skin}}" hair="{{c.hair}}" apron="{{c.apron}}" long-op="{{c.l}}" beard-op="{{c.b}}" initials="{{c.ini}}" w="56" bust="1" hint-size="56px,56px"></dc-import>
      </span>
      <span style="flex: 1; min-width: 0;">
        <span style="display: block; font-size: 15px; font-weight: 800;">{{c.n}}</span>
        <span style="display: block; font-size: 12px; color: #5A5F66;">{{c.cu}} · ★ {{c.r}} · {{c.dist}}</span>
        <span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; margin-top: 2px;">{{c.p}}/guest</span>
      </span>
      <a href="G09-Checkout.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #B8361F; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none;">Book</a>
    </div>
  </sc-for>
  <a href="G04-Home.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; border: 1px solid #1B1D1F; font-size: 15px; font-weight: 700; text-decoration: none; background: #FFFFFF;">Browse all chefs</a>
</div>
</x-dc>

      ]
    };
  }
}
</script>
</body>
</html>
