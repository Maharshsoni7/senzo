<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { active: 1, q: '', searching: false, word: '', sheet: false }; }
  all() {
    return [
      { n: 'Meera Iyer', cu: 'South Indian', tags: 'south indian kerala appam fish veg', r: '4.9', p: '₹1,600', skin: '#9C6440', hair: '#120E0C', apron: '#2F6B4F', l: '1', b: '0', ini: 'MI' },

      { n: 'Jignesh Patel', cu: 'Surti Gujarati', tags: 'gujarati surti undhiyu locho veg', r: '4.7', p: '₹1,400', skin: '#B67A4E', hair: '#2A2420', apron: '#3E7A3A', l: '0', b: '1', ini: 'JP' },
      { n: 'Bhavna Trivedi', cu: 'Gujarati Jain Thali', tags: 'gujarati jain thali veg festive', r: '4.9', p: '₹1,600', skin: '#E0B08A', hair: '#8E9196', apron: '#6B2D5C', l: '1', b: '0', ini: 'BT' },
      { n: 'Rohan Kapoor', cu: 'North Indian Tandoor', tags: 'north indian punjabi tandoor kebab', r: '4.8', p: '₹2,200', skin: '#B67A4E', hair: '#1B1714', apron: '#7A3E1D', l: '0', b: '1', ini: 'RK' },
      { n: 'Zoya Khan', cu: 'Mughlai', tags: 'mughlai biryani nihari', r: '4.8', p: '₹2,000', skin: '#C88B5E', hair: '#1B1310', apron: '#6B2D5C', l: '1', b: '0', ini: 'ZK' },
      { n: 'Kabir Shah', cu: 'Italian', tags: 'italian pasta pizza veg jain', r: '4.7', p: '₹2,500', skin: '#D6A37A', hair: '#3B2A20', apron: '#2D4E86', l: '0', b: '0', ini: 'KS' },
      { n: 'Ishita Patel', cu: 'Plant-based', tags: 'vegan veg jain healthy', r: '4.9', p: '₹1,700', skin: '#E0B08A', hair: '#3A281E', apron: '#3E7A3A', l: '1', b: '0', ini: 'IP' },
      { n: 'Arjun Rao', cu: 'Pan-Asian', tags: 'chinese thai asian dimsum', r: '4.8', p: '₹2,400', skin: '#8E5B39', hair: '#151210', apron: '#1F5F6B', l: '0', b: '0', ini: 'AR' },
      { n: 'Priya Nair', cu: 'Desserts', tags: 'desserts cake sweets eggless', r: '4.9', p: '₹1,500', skin: '#B87D52', hair: '#20150F', apron: '#A23E6B', l: '1', b: '0', ini: 'PN' }
    ];
  }
  renderVals() {
    const s = this.state;
    const q = s.q.trim().toLowerCase();
    const list = this.all().filter((c) => !q || (c.n + ' ' + c.cu + ' ' + c.tags).toLowerCase().indexOf(q) >= 0);
    const active = Math.min(s.active, Math.max(0, list.length - 1));
    const go = (i) => this.setState({ active: (i + list.length) % list.length });
    const chefs = list.map((c, i) => {
      const off = i - active;
      return Object.assign({}, c, {
        tf: off === 0 ? 'scale(1)' : 'translateY(-30px) scale(.7)',
        sh: off === 0 ? 'translateX(-50%)' : 'translateX(-50%) translateY(-30px) scale(.7)',
        op: Math.abs(off) <= 1 ? 1 : 0,
        bob: off === 0 ? 'bob' : '',
        aria: off === 0 ? c.n : 'Show ' + c.n,
        act: () => go(i)
      });
    });
    const words = ['Gujarati', 'Jain', 'Biryani', 'Italian', 'Desserts'];
    return {
      q: s.q, hasQ: !!s.q, searching: s.searching || !!s.q,
      setQ: (e) => this.setState({ q: e.target.value, active: 0 }),
      focus: () => this.setState({ searching: true }),
      clearQ: () => this.setState({ q: '', searching: false, active: 1 }),
      noQ: !q, showFaces: !!q && list.length > 0,
      resultLabel: list.length + (list.length === 1 ? ' chef' : ' chefs') + ' for “' + s.q.trim() + '” · tap a face or swipe',
      faces: list.map((c, i) => Object.assign({}, c, { on: i === active, ring: i === active ? '#B8361F' : '#FFFFFF', go: () => go(i) })),
      words: words.map((w) => { const on = s.q.toLowerCase() === w.toLowerCase(); const cnt = this.all().filter((c) => (c.n + ' ' + c.cu + ' ' + c.tags).toLowerCase().indexOf(w.toLowerCase()) >= 0).length; return { l: w + ' · ' + cnt, bg: on ? '#1B1D1F' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B1D1F', bd: on ? '#1B1D1F' : '#C9CDD1', pick: () => this.setState({ q: on ? '' : w, active: 0 }) }; }),
      chefs, empty: list.length === 0, hasCur: list.length > 0,
      cur: list[active] || {},
      curTags: list[active] ? list[active].tags.split(' ').slice(0, 4) : [],
      sheetOpen: s.sheet && list.length > 0,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      trackTf: 'translateX(' + (-(active * 150 + 75)) + 'px)',
      prev: () => go(active - 1), next: () => go(active + 1),
      tStart: (e) => { this._x = e.touches[0].clientX; },
      tEnd: (e) => { const dx = e.changedTouches[0].clientX - (this._x || 0); if (dx > 40) go(active - 1); else if (dx < -40) go(active + 1); },
      counter: list.length ? (active + 1) + '/' + list.length + ' nearby' : ''
    };
  }
}
</script>
</body>
</html>
