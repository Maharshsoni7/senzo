<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dish illustration</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="display: block; line-height: 0; color: #1B1D1F; font-family: system-ui, sans-serif;">
<svg width="{{w}}" height="{{w}}" viewBox="0 0 200 200" aria-hidden="true" style="display: block;">
  <circle cx="104" cy="108" r="92" fill="rgba(0,0,0,.14)"></circle>

  <sc-if value="{{isThali}}" hint-placeholder-val="{{ false }}">
    <g>
      <circle cx="100" cy="100" r="92" fill="#C3C7CB"></circle>
      <circle cx="100" cy="100" r="86" fill="#E3E6E8"></circle>
      <circle cx="100" cy="100" r="74" fill="none" stroke="#D2D6D9" stroke-width="2"></circle>
      <circle cx="62" cy="60" r="22" fill="#B4B9BD"></circle><circle cx="62" cy="60" r="18" fill="#E2B33C"></circle><circle cx="56" cy="55" r="4" fill="#FFFFFF" opacity=".45"></circle>
      <circle cx="104" cy="44" r="22" fill="#B4B9BD"></circle><circle cx="104" cy="44" r="18" fill="#6E8B3D"></circle><circle cx="98" cy="40" r="3" fill="#B6CC7A"></circle><circle cx="110" cy="48" r="3" fill="#B6CC7A"></circle>
      <circle cx="144" cy="62" r="22" fill="#B4B9BD"></circle><circle cx="144" cy="62" r="18" fill="#F0D9A0"></circle><path d="M136 60 q8 -6 16 0" stroke="#C9A35B" stroke-width="2" fill="none"></path>
      <circle cx="152" cy="104" r="20" fill="#B4B9BD"></circle><circle cx="152" cy="104" r="16" fill="#C0522E"></circle>
      <circle cx="70" cy="122" r="30" fill="#D9B27A"></circle>
      <circle cx="64" cy="114" r="30" fill="#E8C99A"></circle>
      <circle cx="54" cy="106" r="3" fill="#C9965B"></circle><circle cx="72" cy="122" r="3.5" fill="#C9965B"></circle><circle cx="66" cy="100" r="2.5" fill="#C9965B"></circle><circle cx="80" cy="110" r="2" fill="#C9965B"></circle>
      <ellipse cx="118" cy="142" rx="30" ry="21" fill="#FBF7EE"></ellipse>
      <path d="M102 140 h4 M112 134 h4 M124 146 h4 M130 136 h4 M116 150 h4" stroke="#E4DBC4" stroke-width="2" stroke-linecap="round"></path>
      <circle cx="154" cy="140" r="12" fill="#E9A23B"></circle><circle cx="151" cy="137" r="3" fill="#F7D98C"></circle>
    </g>
  </sc-if>

  <sc-if value="{{isBowl}}" hint-placeholder-val="{{ false }}">
    <g>
      <circle cx="100" cy="100" r="92" fill="#FFFFFF"></circle>
      <circle cx="100" cy="100" r="90" fill="none" stroke="#E6E3DD" stroke-width="2"></circle>
      <circle cx="100" cy="100" r="68" fill="#24282C"></circle>
      <circle cx="100" cy="100" r="60" fill="{{c1}}"></circle>
      <path d="M70 92 q14 -16 30 -2 q16 14 30 -4" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85"></path>
      <ellipse cx="86" cy="118" rx="10" ry="5" fill="#C98A3E" transform="rotate(-20 86 118)"></ellipse>
      <ellipse cx="118" cy="122" rx="9" ry="5" fill="#B5651D" transform="rotate(25 118 122)"></ellipse>
      <ellipse cx="102" cy="132" rx="8" ry="4" fill="#E2B33C"></ellipse>
      <path d="M108 74 q8 -10 18 -6 q-6 10 -18 6 Z" fill="#8DBA5A"></path>
      <path d="M100 80 q-4 -12 -14 -12 q2 10 14 12 Z" fill="#6E9B3A"></path>
      <circle cx="80" cy="104" r="1.8" fill="#FBF7EE"></circle><circle cx="126" cy="98" r="1.8" fill="#FBF7EE"></circle><circle cx="110" cy="108" r="1.8" fill="#FBF7EE"></circle><circle cx="92" cy="96" r="1.8" fill="#FBF7EE"></circle>
    </g>
  </sc-if>

  <sc-if value="{{isTart}}" hint-placeholder-val="{{ false }}">
    <g>
      <circle cx="100" cy="100" r="92" fill="#FFFFFF"></circle>
      <circle cx="100" cy="100" r="90" fill="none" stroke="#E6E3DD" stroke-width="2"></circle>
      <path d="M40 150 q30 -10 60 4 q30 14 64 -2" stroke="#B8361F" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"></path>
      <circle cx="100" cy="96" r="58" fill="#C98A3E"></circle>
      <circle cx="100" cy="96" r="58" fill="none" stroke="#B5762F" stroke-width="5" stroke-dasharray="6 5"></circle>
      <circle cx="100" cy="96" r="48" fill="{{c1}}"></circle>
      <circle cx="90" cy="86" r="14" fill="#FFFFFF" opacity=".18"></circle>
      <path d="M84 80 l6 4 M112 90 l5 -5 M96 112 l6 2 M118 108 l3 6 M80 102 l-4 5" stroke="#B8361F" stroke-width="2" stroke-linecap="round"></path>
      <circle cx="104" cy="80" r="3" fill="#9BB55A"></circle><circle cx="86" cy="98" r="3" fill="#9BB55A"></circle><circle cx="110" cy="102" r="3" fill="#9BB55A"></circle><circle cx="96" cy="120" r="3" fill="#9BB55A"></circle>
      <path d="M118 62 q14 -4 18 8 q-14 4 -18 -8 Z" fill="#5E9B4A"></path>
    </g>
  </sc-if>

  <sc-if value="{{isTaco}}" hint-placeholder-val="{{ false }}">
    <g>
      <circle cx="100" cy="100" r="92" fill="#FFFFFF"></circle>
      <circle cx="100" cy="100" r="90" fill="none" stroke="#E6E3DD" stroke-width="2"></circle>
      <g transform="rotate(-25 70 80)"><path d="M40 82 a32 32 0 0 1 64 0 Z" fill="#E8C46A"></path><path d="M46 80 a26 20 0 0 1 52 0" stroke="{{c1}}" stroke-width="7" fill="none"></path><circle cx="60" cy="72" r="2.5" fill="#6E9B3A"></circle><circle cx="80" cy="68" r="2.5" fill="#B8361F"></circle></g>
      <g transform="rotate(10 130 96)"><path d="M98 100 a32 32 0 0 1 64 0 Z" fill="#E8C46A"></path><path d="M104 98 a26 20 0 0 1 52 0" stroke="{{c1}}" stroke-width="7" fill="none"></path><circle cx="120" cy="88" r="2.5" fill="#6E9B3A"></circle><circle cx="140" cy="86" r="2.5" fill="#B8361F"></circle></g>
      <g transform="rotate(-5 90 140)"><path d="M58 144 a32 32 0 0 1 64 0 Z" fill="#E8C46A"></path><path d="M64 142 a26 20 0 0 1 52 0" stroke="{{c1}}" stroke-width="7" fill="none"></path><circle cx="78" cy="132" r="2.5" fill="#6E9B3A"></circle><circle cx="100" cy="130" r="2.5" fill="#B8361F"></circle></g>
      <circle cx="150" cy="140" r="10" fill="#8DBA5A"></circle><circle cx="150" cy="140" r="5" fill="#C9E09A"></circle>
    </g>
  </sc-if>

  <sc-if value="{{isPlatter}}" hint-placeholder-val="{{ false }}">
    <g>
      <rect x="14" y="30" width="172" height="140" rx="18" fill="#9A7656"></rect>
      <rect x="20" y="36" width="160" height="128" rx="14" fill="#B58A62"></rect>
      <path d="M30 60 h140 M30 100 h140 M30 140 h140" stroke="#A67C55" stroke-width="2"></path>
      <rect x="38" y="52" width="36" height="30" rx="4" fill="{{c1}}"></rect>
      <rect x="82" y="52" width="36" height="30" rx="4" fill="{{c1}}"></rect>
      <rect x="126" y="52" width="36" height="30" rx="4" fill="{{c1}}"></rect>
      <rect x="38" y="92" width="36" height="30" rx="4" fill="{{c1}}"></rect>
      <rect x="82" y="92" width="36" height="30" rx="4" fill="{{c1}}"></rect>
      <rect x="126" y="92" width="36" height="30" rx="4" fill="{{c1}}"></rect>
      <circle cx="50" cy="60" r="2" fill="#1B1D1F"></circle><circle cx="96" cy="58" r="2" fill="#1B1D1F"></circle><circle cx="140" cy="62" r="2" fill="#1B1D1F"></circle><circle cx="56" cy="102" r="2" fill="#1B1D1F"></circle><circle cx="104" cy="100" r="2" fill="#1B1D1F"></circle><circle cx="146" cy="104" r="2" fill="#1B1D1F"></circle>
      <path d="M60 66 q4 -3 8 0 M104 64 q4 -3 8 0 M146 68 q4 -3 8 0 M60 106 q4 -3 8 0 M106 104 q4 -3 8 0 M148 108 q4 -3 8 0" stroke="#6E9B3A" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <path d="M48 140 q20 -8 40 2" stroke="#3E7A3A" stroke-width="6" fill="none" stroke-linecap="round"></path>
      <ellipse cx="136" cy="142" rx="22" ry="10" fill="#7FA347"></ellipse><ellipse cx="136" cy="140" rx="16" ry="6" fill="#B6CC7A"></ellipse>
    </g>
  </sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["thali","bowl","tart","taco","platter"],"default":"thali"},"c1":{"editor":"color","default":"#E2B33C"},"w":{"editor":null,"default":"200"},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'thali';
    return {
      w: Number(this.props.w) || 200, c1: this.props.c1 || '#E2B33C',
      isThali: k === 'thali', isBowl: k === 'bowl', isTart: k === 'tart', isTaco: k === 'taco', isPlatter: k === 'platter'
    };
  }
}
</script>
</body>
</html>
