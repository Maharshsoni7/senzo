<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooking in progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1B1D1F}a:hover{color:#B8361F}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; color: #1B1D1F; font-family: 'Archivo', system-ui, sans-serif; background-color: #ECE8E1; isolation: isolate; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 16px;">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: -1;">
    <dc-import name="KitchenBg" variant="header" strip="162" hint-size="390px,844px"></dc-import>
  </div>
  <div style="text-align: center;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #1E6B36; font-weight: 600;">● COOKING · RAHUL DESAI</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 52px; font-weight: 600; margin-top: 6px;">01:12:40</div>
    <div style="font-size: 13px; color: #3D4247;">Started 5:42 PM · serve dinner at 7:30 PM</div>
  </div>

  <div style="background: #FBEDEA; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45; color: #6E2414;"><strong>Remember:</strong> 2 guests Jain (no root veg) · 1 peanut allergy</div>

  <div style="background: #FFFEFB; border-radius: 4px; box-shadow: 0 10px 18px rgba(0,0,0,.08); padding: 6px 16px;">
    <sc-for list="{{items}}" as="i" hint-placeholder-count="5">
      <button onClick="{{i.tick}}" aria-pressed="{{i.on}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 54px; border: none; border-bottom: 1px dashed #D5D8DB; background: transparent; font-family: inherit; font-size: 15px; cursor: pointer; text-align: left; color: #1B1D1F; padding: 0;">
        <span style="width: 24px; height: 24px; border-radius: 7px; flex: none; display: grid; place-items: center; border: 2px solid {{i.bd}}; background: {{i.bg}};">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        </span>
        <span style="text-decoration: {{i.strike}}; color: {{i.fg}};">{{i.l}}</span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
    <a href="C08-Completed.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #B8361F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">Mark as done · ask for finish OTP</a>
  </sc-if>
  <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #D5D8DB; color: #3D4247; font-size: 15px; font-weight: 700;">{{left}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: [0, 1] }; }
  renderVals() {
    const d = this.state.done;
    const list = ['Farsan platter served', 'Deconstructed Undhiyu', 'Dal-bhaat-rotli', 'Kesar Shrikhand Tart', 'Kitchen cleaned up'];
    const left = list.length - d.length;
    return {
      items: list.map((l, i) => { const on = d.indexOf(i) >= 0; return { l, on, bd: on ? '#1E7A3C' : '#9EA4AA', bg: on ? '#1E7A3C' : '#FFFFFF', strike: on ? 'line-through' : 'none', fg: on ? '#5A5F66' : '#1B1D1F', tick: () => this.setState({ done: on ? d.filter((x) => x !== i) : d.concat([i]) }) }; }),
      allDone: left === 0, notDone: left > 0,
      left: left + ' step' + (left > 1 ? 's' : '') + ' left'
    };
  }
}
</script>
</body>
</html>
