<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1B1D1F}a:hover{color:#B8361F}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; color: #1B1D1F; font-family: 'Archivo', system-ui, sans-serif; background-color: #ECE8E1; isolation: isolate; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 18px;">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: -1;">
    <dc-import name="KitchenBg" variant="header" strip="100" hint-size="390px,844px"></dc-import>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="G04-Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9CDD1; display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 24px;">Account</h1>
  </div>
  <div style="background: #FFFEFB; border-radius: 4px; padding: 18px; display: flex; gap: 14px; align-items: center;">
    <span style="width: 56px; height: 56px; border-radius: 99px; background: #24282C; color: #FFFFFF; display: grid; place-items: center; font-weight: 800; font-size: 20px;">RD</span>
    <div style="flex: 1;">
      <div style="font-size: 18px; font-weight: 700;">Rahul Desai</div>
      <div style="font-size: 13px; color: #5A5F66;">+91 98250 41234</div>
    </div>
    <div style="text-align: right;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600;">₹250</div>
      <div style="font-size: 11px; color: #5A5F66;">wallet</div>
    </div>
  </div>
  <div style="background: #FBEDEA; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 14px; font-weight: 800; color: #6E2414;">Allergies &amp; food rules</span>
      <button style="border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #B8361F; cursor: pointer; min-height: 32px;">Edit</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <span style="font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #B8361F; color: #FFFFFF;">Peanut allergy</span>
      <span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF;">Jain for 2 family members</span>
      <span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF;">No mushrooms</span>
    </div>
    <div style="font-size: 11px; color: #6E2414;">Shared with every chef you book — they must confirm before accepting.</div>
  </div>
  <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="{{r.href}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border-bottom: 1px solid #F1F2F3; text-decoration: none; font-size: 15px; font-weight: 600;">
        <span>{{r.l}}</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; color: #5A5F66;">{{r.v}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
      </a>
    </sc-for>
  </div>
  <a href="C04-Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; border: 1.5px solid #1B1D1F; font-size: 15px; font-weight: 700; text-decoration: none;">Switch to chef mode</a>
  <a href="G01-Welcome.dc.html" style="text-align: center; font-size: 14px; font-weight: 600; color: #B8361F; text-decoration: none; min-height: 44px; display: flex; align-items: center; justify-content: center;">Log out</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { l: 'Saved addresses', v: '2', href: 'G18-Address.dc.html' },
        { l: 'Payment methods', v: 'GPay, card', href: 'G14-Account.dc.html' },
        { l: 'Favourite chefs', v: '3', href: 'G14-Account.dc.html' },
        { l: 'Invoices', v: '', href: 'G21-Invoice.dc.html' },
        { l: 'Help & support', v: '', href: 'G14-Account.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
