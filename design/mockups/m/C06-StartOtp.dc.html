<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter start OTP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1B1D1F}a:hover{color:#B8361F}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; color: #1B1D1F; font-family: 'Archivo', system-ui, sans-serif; background-color: #ECE8E1; isolation: isolate; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 18px;">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: -1;">
    <dc-import name="KitchenBg" variant="header" strip="100" hint-size="390px,844px"></dc-import>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="C04-Dashboard.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #C9CDD1; display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div>
      <div style="font-size: 17px; font-weight: 700;">Rahul Desai · 6 guests</div>
      <div style="font-size: 12px; color: #3D4247;">B-402 Shaligram Heights, Bodakdev</div>
    </div>
  </div>
  <div style="text-align: center; margin-top: 44px;">
    <h1 style="margin: 0; font-size: 26px;">You've arrived?</h1>
    <p style="margin: 6px 0 0; font-size: 14px; color: #3D4247;">Ask Rahul for the 4-digit start OTP</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, 60px); gap: 12px; justify-content: center; font-family: 'IBM Plex Mono', monospace;">
    <sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
      <span style="height: 68px; border-radius: 14px; background: #FFFFFF; display: grid; place-items: center; font-size: 30px; font-weight: 600; border: 2px solid {{b.bd}};">{{b.v}}</span>
    </sc-for>
  </div>
  <div style="text-align: center; font-size: 14px; font-weight: 700; min-height: 20px; color: {{msgFg}};">{{msg}}</div>

  <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
    <a href="C07-Cooking.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #1E7A3C; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">Start cooking</a>
  </sc-if>
  <sc-if value="{{notOk}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 60px; border-radius: 14px; border: none; background: {{k.bg}}; font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500; cursor: pointer; color: #1B1D1F;">{{k.l}}</button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: '' }; }
  renderVals() {
    const v = this.state.v;
    const full = v.length === 4;
    const ok = full && v === '4821';
    const bad = full && !ok;
    const press = (d) => () => {
      if (d === 'del') return this.setState({ v: v.slice(0, -1) });
      if (d === 'clr') return this.setState({ v: '' });
      if (v.length < 4) this.setState({ v: v + d });
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'].map((k) => ({
      l: k === 'del' ? '⌫' : k === 'clr' ? 'C' : k, aria: k === 'del' ? 'Delete' : k === 'clr' ? 'Clear' : k,
      bg: k === 'del' || k === 'clr' ? 'transparent' : '#FFFFFF', press: press(k)
    }));
    return {
      boxes: [0, 1, 2, 3].map((i) => ({ v: v[i] || '', bd: ok ? '#1E7A3C' : bad ? '#B8361F' : i === v.length ? '#1B1D1F' : '#D5D8DB' })),
      keys, ok, notOk: !ok,
      msg: ok ? 'OTP matched — job started at 5:42 PM' : bad ? 'Wrong code. Try again (hint: 4821)' : '',
      msgFg: ok ? '#1E6B36' : '#B8361F'
    };
  }
}
</script>
</body>
</html>
